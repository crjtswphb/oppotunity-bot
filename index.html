<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>商談Bot</title>
  <script src="https://static.worksmobile.net/static/wm/woff/edge/3.4/sdk.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { font-family: -apple-system, sans-serif; background: #F2F2F7; width: 100%; height: 100%; overflow-x: hidden; }
    .header { background: #fff; padding: 16px 20px; padding-top: max(16px, env(safe-area-inset-top)); border-bottom: 1px solid #E5E5EA; position: sticky; top: 0; z-index: 10; }
    .header h1 { font-size: 17px; font-weight: 600; text-align: center; }
    .tab-bar { display: flex; background: #fff; border-bottom: 1px solid #E5E5EA; }
    .tab { flex: 1; padding: 12px; text-align: center; font-size: 14px; color: #8E8E93; cursor: pointer; border-bottom: 2px solid transparent; }
    .tab.active { color: #00B900; border-bottom: 2px solid #00B900; }
    .section { display: none; padding: 16px; }
    .section.active { display: block; }
    .input-group { background: #fff; border-radius: 12px; overflow: hidden; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .input-group input, .input-group textarea { width: 100%; padding: 14px 16px; border: none; border-bottom: 1px solid #E5E5EA; font-size: 16px; outline: none; display: block; }
    .input-group textarea { min-height: 100px; resize: none; }
    .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; color: #fff; }
    .btn-search { background: #00B900; }
    .btn-add { background: #007AFF; }
    .status { font-size: 13px; color: #8E8E93; text-align: center; margin-top: 12px; min-height: 18px; }
    .result-list { background: #fff; border-radius: 12px; overflow: hidden; margin-top: 16px; list-style: none; }
    .result-item { padding: 14px 16px; border-bottom: 1px solid #E5E5EA; display: flex; justify-content: space-between; }
    .detail-card { background: #fff; border-radius: 12px; margin-top: 16px; display: none; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .detail-card.show { display: block; }
    .detail-header { background: #00B900; padding: 12px; color: #fff; font-weight: 600; }
    .detail-row { padding: 12px; border-bottom: 1px solid #E5E5EA; display: flex; }
    .detail-label { min-width: 80px; color: #8E8E93; font-size: 13px; }
    .sent-badge { background: #E8F8E8; color: #00B900; padding: 10px; border-radius: 8px; margin-top: 10px; display: none; text-align: center; }
  </style>
</head>
<body>

<div class="header"><h1>📊 商談Bot</h1></div>
<div class="tab-bar">
  <div class="tab active" id="tab-search" onclick="switchTab('search')">🔍 参照</div>
  <div class="tab" id="tab-add" onclick="switchTab('add')">✏️ 入力</div>
</div>

<div class="section active" id="section-search">
  <div class="input-group"><input type="text" id="searchInput" placeholder="会社名を入力"></div>
  <button class="btn btn-search" onclick="doSearch()">検索する</button>
  <p class="status" id="searchStatus"></p>
  <ul class="result-list" id="resultList"></ul>
  <div class="detail-card" id="resultDetail">
    <div class="detail-header">詳細情報</div>
    <div class="detail-row"><span class="detail-label">会社名</span><span id="d-name"></span></div>
    <div class="detail-row"><span class="detail-label">内容</span><span id="d-content"></span></div>
  </div>
  <div class="sent-badge" id="sentBadge">✅ チャットに送信しました</div>
</div>

<div class="section" id="section-add">
  <div class="input-group">
    <input type="text" id="addCompany" placeholder="会社名">
    <textarea id="addContent" placeholder="商談内容"></textarea>
  </div>
  <button class="btn btn-add" onclick="doAdd()">登録する</button>
  <p class="status" id="addStatus"></p>
</div>

<script>
  // 【重要】ここのURLが最新のGASデプロイURLであることを確認してください
  const GAS_URL = "https://script.google.com/macros/s/AKfycbxhVIpeLzG2_8K9v_bGRIDITDp4-f_ZHqGTdnkXm8lKAYn8rajcVbBv7DtI9R_PeuO2/exec";
  const WOFF_ID = "j5bJbWn6Qg1ppttwac1wMA";
  let userId = "";

  const inWoff = typeof woff !== "undefined";

  window.onload = () => {
    const mode = new URLSearchParams(window.location.search).get('mode');
    if (mode === 'add') switchTab('add');
    if (!inWoff) return;
    woff.init({ woffId: WOFF_ID })
      .then(() => woff.getProfile())
      .then(profile => { userId = profile.userId; })
      .catch(console.error);
  };

  function switchTab(tab) {
    document.getElementById('tab-search').classList.toggle('active', tab === 'search');
    document.getElementById('tab-add').classList.toggle('active', tab === 'add');
    document.getElementById('section-search').classList.toggle('active', tab === 'search');
    document.getElementById('section-add').classList.toggle('active', tab === 'add');
  }

  async function doSearch() {
    const company = document.getElementById("searchInput").value.trim();
    if (!company) return;
    document.getElementById("searchStatus").textContent = "検索中...";
    document.getElementById("resultList").innerHTML = "";
    document.getElementById("resultDetail").classList.remove("show");
    document.getElementById("sentBadge").style.display = "none";

    try {
      const res = await fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ action: "search", company: company })
      });
      const data = await res.json();
      const results = Array.isArray(data) ? data : (data.records || []);
      const list = document.getElementById("resultList");

      if (results.length === 0) {
        document.getElementById("searchStatus").textContent = "該当する商談が見つかりませんでした。";
        return;
      }

      document.getElementById("searchStatus").textContent = `${results.length}件見つかりました`;
      results.forEach((item, i) => {
        const li = document.createElement("li");
        li.className = "result-item";
        li.innerHTML = `<span>${item["会社名"] || "（名称なし）"}</span><span style="color:#8E8E93;font-size:13px;">▶</span>`;
        li.onclick = () => {
          document.getElementById("d-name").textContent = item["会社名"] || "";
          document.getElementById("d-content").textContent = item["商談内容"] || "";
          document.getElementById("resultDetail").classList.add("show");
          if (inWoff && woff.isInClient()) {
            const msg = `【${item["会社名"]}】\n${item["商談内容"] || ""}`;
            woff.sendMessage({ content: { type: "text", text: msg } });
            document.getElementById("sentBadge").style.display = "block";
          }
        };
        list.appendChild(li);
      });
    } catch (e) {
      document.getElementById("searchStatus").textContent = "エラーが発生しました。";
    }
  }

  async function doAdd() {
    const company = document.getElementById("addCompany").value.trim();
    const content = document.getElementById("addContent").value.trim();
    if (!company || !content) return;
    document.getElementById("addStatus").textContent = "登録中...";

    try {
      await fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ action: "add", company, content, userId })
      });
      document.getElementById("addStatus").textContent = "送信完了";
      if (inWoff && woff.isInClient()) {
        woff.sendMessage({ content: { type: "text", text: "✅ 商談を登録しました" } });
        setTimeout(() => woff.closeWindow(), 1500);
      }
    } catch (e) {
      document.getElementById("addStatus").textContent = "エラーが発生しました。";
    }
  }
</script>
</body>
</html>
