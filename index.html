<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>商談Bot</title>
  <script src="https://static.worksmobile.net/static/wm/woff/edge/3.7.1/sdk.js"></script>
  <style>
    :root {
      --navy-900: #0b1f3b;
      --navy-800: #13315c;
      --navy-700: #19457b;
      --bg: #f4f7fb;
      --surface: #ffffff;
      --line: #d7dfeb;
      --text: #12243d;
      --muted: #5d6f87;
      --success-bg: #e7f4ec;
      --success-text: #1d7a42;
      --shadow: 0 8px 18px rgba(11, 31, 59, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
      background: linear-gradient(180deg, #edf3fb 0%, var(--bg) 45%, #f8fafd 100%);
      color: var(--text);
    }
    body { padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
    .header {
      background: linear-gradient(135deg, var(--navy-900), var(--navy-800));
      color: #fff;
      padding: max(16px, env(safe-area-inset-top)) 18px 14px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 4px 14px rgba(11, 31, 59, 0.2);
    }
    .header h1 { font-size: 18px; font-weight: 700; text-align: center; letter-spacing: 0.03em; }
    .header-sub { margin-top: 4px; text-align: center; font-size: 12px; color: rgba(255, 255, 255, 0.78); }
    .container {
      width: min(100%, 960px);
      margin: 0 auto;
      padding: 14px 12px 20px;
    }
    .tab-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 4px;
      box-shadow: var(--shadow);
      margin-bottom: 12px;
    }
    .tab {
      border: none;
      appearance: none;
      background: transparent;
      padding: 11px 8px;
      text-align: center;
      font-size: 14px;
      color: var(--muted);
      cursor: pointer;
      border-radius: 10px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .tab.active {
      background: var(--navy-900);
      color: #fff;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
    }
    .section { display: none; }
    .section.active { display: block; }
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      box-shadow: var(--shadow);
    }
    .panel-title { font-size: 14px; color: var(--navy-800); font-weight: 700; margin-bottom: 10px; }
    .input-group { margin-bottom: 12px; }
    .input-group input, .input-group textarea {
      width: 100%;
      padding: 13px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      background: #fff;
      color: var(--text);
    }
    .input-group textarea { min-height: 120px; resize: vertical; }
    .input-group input:focus, .input-group textarea:focus {
      border-color: var(--navy-700);
      box-shadow: 0 0 0 3px rgba(25, 69, 123, 0.15);
    }
    .btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, var(--navy-800), var(--navy-900));
      box-shadow: 0 6px 14px rgba(11, 31, 59, 0.24);
    }
    .btn:active { transform: translateY(1px); }
    .status {
      font-size: 13px;
      color: var(--muted);
      margin-top: 10px;
      min-height: 18px;
    }
    .status.status-success {
      color: var(--success-text);
      font-weight: 600;
    }
    .result-list {
      margin-top: 12px;
      list-style: none;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
    }
    .result-item {
      padding: 13px 12px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      cursor: pointer;
    }
    .result-item:last-child { border-bottom: none; }
    .result-item-arrow { color: var(--muted); font-size: 13px; }
    .detail-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      margin-top: 12px;
      display: none;
      flex-direction: column;
      overflow: hidden;
      background: #fff;
    }
    .detail-card.show { display: flex; }
    .detail-header {
      background: linear-gradient(135deg, var(--navy-800), var(--navy-900));
      color: #fff;
      font-weight: 700;
      padding: 11px 12px;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }
    .detail-header-title { flex: 1; min-width: 0; }
    .btn-detail-edit {
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      color: var(--navy-900);
      background: #fff;
      box-shadow: 0 2px 8px rgba(11, 31, 59, 0.12);
    }
    .btn-detail-edit:active { transform: translateY(1px); }
    .detail-row {
      padding: 11px 12px;
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { min-width: 72px; color: var(--muted); font-size: 12px; }
    .detail-value { font-size: 14px; line-height: 1.5; word-break: break-word; }
    .sent-badge {
      background: var(--success-bg);
      color: var(--success-text);
      padding: 10px;
      border-radius: 10px;
      margin-top: 10px;
      display: none;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
    }
    .result-item-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .btn-secondary {
      width: 100%;
      border: 1px solid var(--navy-700);
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      color: var(--navy-800);
      background: var(--surface);
      box-shadow: 0 2px 8px rgba(11, 31, 59, 0.06);
    }
    .btn-secondary:active { transform: translateY(1px); }
    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .btn-cancel {
      border-color: var(--line);
      color: var(--muted);
      font-weight: 600;
      background: #f8fafc;
    }
    .edit-panel {
      display: none;
      border-top: 1px solid var(--line);
      padding: 12px;
      background: #f8fafd;
    }
    .edit-panel.show { display: block; }
    .edit-panel .input-group { margin-bottom: 10px; }
    .edit-panel .input-group label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
      font-weight: 600;
    }
    .edit-panel .input-group input[type="date"] {
      min-height: 46px;
      color-scheme: light;
    }
    .edit-status { font-size: 12px; color: var(--muted); margin-top: 8px; min-height: 16px; }
    @media (min-width: 768px) {
      .container { padding: 20px 18px 30px; }
      .panel { padding: 18px; }
      .panel-title { font-size: 15px; }
      .input-group textarea { min-height: 140px; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1>商談管理ダッシュボード</h1>
  <p class="header-sub">Opportunity Bot</p>
</div>
<div class="container">
  <div class="tab-bar">
    <button class="tab active" id="tab-search" onclick="switchTab('search')">検索タブ</button>
    <button class="tab" id="tab-add" onclick="switchTab('add')">入力タブ</button>
  </div>

<div class="section active" id="section-search">
  <div class="panel">
    <p class="panel-title">商談履歴を検索</p>
    <div class="input-group"><input type="text" id="searchInput" placeholder="会社名を入力"></div>
    <button class="btn btn-search" onclick="doSearch()">検索する</button>
    <p class="status" id="searchStatus"></p>
    <ul class="result-list" id="resultList"></ul>
    <div class="detail-card" id="resultDetail">
      <div class="detail-header">
        <span class="detail-header-title">詳細情報</span>
        <button type="button" class="btn-detail-edit" onclick="openEditForm()">修正する</button>
      </div>
      <div class="detail-row"><span class="detail-label">会社名</span><span class="detail-value" id="d-name"></span></div>
      <div class="detail-row"><span class="detail-label">内容</span><span class="detail-value" id="d-content"></span></div>
      <div class="detail-row"><span class="detail-label">日付</span><span class="detail-value" id="d-date"></span></div>
      <div class="edit-panel" id="editPanel">
        <p class="panel-title" style="margin-bottom:8px;">商談を編集</p>
        <div class="input-group">
          <label for="editCompany">会社名</label>
          <input type="text" id="editCompany" autocomplete="organization">
        </div>
        <div class="input-group">
          <label for="editContent">商談内容</label>
          <textarea id="editContent" placeholder="商談内容"></textarea>
        </div>
        <div class="input-group">
          <label for="editDate">日付</label>
          <input type="date" id="editDate">
        </div>
        <div class="btn-row">
          <button type="button" class="btn-secondary btn-cancel" onclick="closeEditForm()">キャンセル</button>
          <button type="button" class="btn" style="margin:0;" onclick="doSaveEdit()">保存する</button>
        </div>
        <p class="edit-status" id="editStatus"></p>
      </div>
    </div>
    <div class="sent-badge" id="sentBadge">チャットに送信しました</div>
  </div>
</div>

<div class="section" id="section-add">
  <div class="panel">
    <p class="panel-title">新規商談を登録</p>
    <div class="input-group">
      <input type="text" id="addCompany" placeholder="会社名">
    </div>
    <div class="input-group">
      <textarea id="addContent" placeholder="商談内容"></textarea>
    </div>
    <button class="btn btn-add" onclick="doAdd()">登録する</button>
    <p class="status" id="addStatus"></p>
  </div>
</div>
</div>

<script>
  // 【重要】ここのURLが最新のGASデプロイURLであることを確認してください
  const GAS_URL = "https://script.google.com/macros/s/AKfycbxhVIpeLzG2_8K9v_bGRIDITDp4-f_ZHqGTdnkXm8lKAYn8rajcVbBv7DtI9R_PeuO2/exec";
  const WOFF_ID = "j5bJbWn6Qg1ppttwac1wMA";
  let userId = "";
  /** @type {{ id: string, 会社名: string, 商談内容: string, 日付: string } | null} */
  let currentRecord = null;

  /** LINE WORKS クライアント内でのみ true（外部ブラウザでは woff は存在しても init しない） */
  function inWoffClient() {
    try {
      return typeof woff !== "undefined" && typeof woff.isInClient === "function" && woff.isInClient();
    } catch (e) {
      return false;
    }
  }

  function recordIdFromItem(item) {
    if (!item) return "";
    if (item.id != null && item.id !== "") return String(item.id);
    if (item.$id != null) {
      const v = item.$id;
      return String(typeof v === "object" && v && v.value != null ? v.value : v);
    }
    if (item["レコード番号"] != null) return String(item["レコード番号"]);
    return "";
  }

  function toDateInputValue(raw) {
    if (raw == null || raw === "") return "";
    const s = String(raw).trim();
    const iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (iso) return iso[0];
    const slash = s.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})/);
    if (slash) {
      const y = slash[1];
      const mo = String(slash[2]).padStart(2, "0");
      const d = String(slash[3]).padStart(2, "0");
      return y + "-" + mo + "-" + d;
    }
    return "";
  }

  function openEditForm() {
    if (!currentRecord) return;
    if (!currentRecord.id) {
      document.getElementById("editStatus").textContent = "レコードIDがありません。GASの検索結果に id（kintoneの$id）を含めてください。";
      document.getElementById("editPanel").classList.add("show");
      return;
    }
    document.getElementById("editStatus").textContent = "";
    document.getElementById("editCompany").value = currentRecord["会社名"] || "";
    document.getElementById("editContent").value = currentRecord["商談内容"] || "";
    document.getElementById("editDate").value = toDateInputValue(currentRecord["日付"]);
    document.getElementById("editPanel").classList.add("show");
  }

  function closeEditForm() {
    document.getElementById("editPanel").classList.remove("show");
    document.getElementById("editStatus").textContent = "";
  }

  async function doSaveEdit() {
    if (!currentRecord || !currentRecord.id) {
      document.getElementById("editStatus").textContent = "更新できません（レコードIDなし）";
      return;
    }
    const company = document.getElementById("editCompany").value.trim();
    const content = document.getElementById("editContent").value.trim();
    const date = document.getElementById("editDate").value.trim();
    if (!company || !content) {
      document.getElementById("editStatus").textContent = "会社名と商談内容を入力してください";
      return;
    }
    document.getElementById("editStatus").textContent = "保存中…";
    const body = JSON.stringify({
      action: "update",
      recordId: currentRecord.id,
      company,
      content,
      date
    });
    try {
      const res = await fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.ok === false || data.error) {
        document.getElementById("editStatus").textContent = data.error || "保存に失敗しました";
        return;
      }
      currentRecord["会社名"] = company;
      currentRecord["商談内容"] = content;
      currentRecord["日付"] = date || currentRecord["日付"];
      document.getElementById("d-name").textContent = company;
      document.getElementById("d-content").textContent = content;
      document.getElementById("d-date").textContent = date || document.getElementById("d-date").textContent;
      closeEditForm();
      const okStatus = document.getElementById("searchStatus");
      okStatus.classList.add("status-success");
      okStatus.textContent = "✅ 更新完了！";
      if (inWoffClient()) {
        woff.sendMessage([{ type: "text", text: "✅ 更新完了！\n【" + company + "】" }]);
      }
    } catch (e) {
      document.getElementById("editStatus").textContent = "通信エラーが発生しました";
    }
  }

  window.onload = () => {
    const mode = new URLSearchParams(window.location.search).get('mode');
    if (mode === 'add') switchTab('add');
    if (!inWoffClient()) return;
    woff.init({ woffId: WOFF_ID })
      .then(() => woff.getProfile())
      .then(profile => { userId = profile.userId; })
      .catch(console.error);
  };

  function switchTab(tab) {
    document.getElementById('tab-search').classList.toggle('active', tab === 'search');
    document.getElementById('tab-add').classList.toggle('active', tab === 'add');
    document.getElementById('section-search').classList.toggle('active', tab === 'search');
    document.getElementById('section-add').classList.toggle('active', tab === 'add');
  }

  async function doSearch() {
    const company = document.getElementById("searchInput").value.trim();
    if (!company) return;
    const searchStatusEl = document.getElementById("searchStatus");
    searchStatusEl.classList.remove("status-success");
    searchStatusEl.textContent = "検索中...";
    document.getElementById("resultList").innerHTML = "";
    document.getElementById("resultDetail").classList.remove("show");
    document.getElementById("editPanel").classList.remove("show");
    currentRecord = null;
    document.getElementById("sentBadge").style.display = "none";

    try {
      const res = await fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ action: "search", company: company })
      });
      const data = await res.json();
      const results = Array.isArray(data) ? data : (data.records || []);
      const list = document.getElementById("resultList");

      if (results.length === 0) {
        document.getElementById("searchStatus").textContent = "該当する商談が見つかりませんでした。";
        return;
      }

      document.getElementById("searchStatus").textContent = `${results.length}件見つかりました`;
      results.forEach((item, i) => {
        const li = document.createElement("li");
        li.className = "result-item";
        const name = item["会社名"] || "（名称なし）";
        const dateDisp = item["日付"] ? `<div class="result-item-meta">${String(item["日付"])}</div>` : "";
        li.innerHTML = `<div><span>${name}</span>${dateDisp}</div><span class="result-item-arrow">詳細</span>`;
        li.onclick = () => {
          const rid = recordIdFromItem(item);
          currentRecord = {
            id: rid,
            会社名: item["会社名"] || "",
            商談内容: item["商談内容"] || "",
            日付: item["日付"] != null ? String(item["日付"]) : ""
          };
          document.getElementById("d-name").textContent = currentRecord["会社名"];
          document.getElementById("d-content").textContent = currentRecord["商談内容"];
          document.getElementById("d-date").textContent = currentRecord["日付"];
          document.getElementById("editPanel").classList.remove("show");
          document.getElementById("editStatus").textContent = "";
          document.getElementById("resultDetail").classList.add("show");
          if (inWoffClient()) {
            const msg = `【${item["会社名"]}】\n${item["商談内容"] || ""}${currentRecord["日付"] ? "\n日付: " + currentRecord["日付"] : ""}`;
            woff.sendMessage([{ type: "text", text: msg }]);
            document.getElementById("sentBadge").style.display = "block";
          }
        };
        list.appendChild(li);
      });
    } catch (e) {
      document.getElementById("searchStatus").textContent = "エラーが発生しました。";
    }
  }

  async function doAdd() {
    const company = document.getElementById("addCompany").value.trim();
    const content = document.getElementById("addContent").value.trim();
    if (!company || !content) return;
    document.getElementById("addStatus").textContent = "登録中...";

    try {
      await fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ action: "add", company, content, userId })
      });
      document.getElementById("addStatus").textContent = "送信完了";
      if (inWoffClient()) {
        woff.sendMessage([{ type: "text", text: "✅ 商談を登録しました" }]);
        setTimeout(() => woff.closeWindow(), 1500);
      }
    } catch (e) {
      document.getElementById("addStatus").textContent = "エラーが発生しました。";
    }
  }
</script>
</body>
</html>
