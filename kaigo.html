<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>訪問介護記録</title>
  <script src="https://static.worksmobile.net/static/wm/woff/edge/3.7.1/sdk.js"></script>
  <style>
    :root {
      --navy-900: #0b1f3b;
      --navy-800: #13315c;
      --navy-700: #19457b;
      --bg: #f4f7fb;
      --surface: #ffffff;
      --line: #d7dfeb;
      --text: #12243d;
      --muted: #5d6f87;
      --success-bg: #e7f4ec;
      --success-text: #1d7a42;
      --shadow: 0 8px 18px rgba(11, 31, 59, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
      background: linear-gradient(180deg, #edf3fb 0%, var(--bg) 45%, #f8fafd 100%);
      color: var(--text);
    }
    body { padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
    .header {
      background: linear-gradient(135deg, var(--navy-900), var(--navy-800));
      color: #fff;
      padding: max(16px, env(safe-area-inset-top)) 18px 14px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 4px 14px rgba(11, 31, 59, 0.2);
    }
    .header h1 { font-size: 18px; font-weight: 700; text-align: center; letter-spacing: 0.03em; }
    .header-sub { margin-top: 4px; text-align: center; font-size: 12px; color: rgba(255, 255, 255, 0.78); }
    .container {
      width: min(100%, 960px);
      margin: 0 auto;
      padding: 14px 12px 20px;
    }
    .tab-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 4px;
      box-shadow: var(--shadow);
      margin-bottom: 12px;
    }
    .tab {
      border: none;
      appearance: none;
      background: transparent;
      padding: 11px 8px;
      text-align: center;
      font-size: 14px;
      color: var(--muted);
      cursor: pointer;
      border-radius: 10px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .tab.active {
      background: var(--navy-900);
      color: #fff;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
    }
    .section { display: none; }
    .section.active { display: block; }
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      box-shadow: var(--shadow);
    }
    .panel-title { font-size: 14px; color: var(--navy-800); font-weight: 700; margin-bottom: 10px; }
    .input-group { margin-bottom: 12px; }
    .input-group label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
      font-weight: 600;
    }
    .input-group input, .input-group textarea {
      width: 100%;
      padding: 13px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      background: #fff;
      color: var(--text);
    }
    .input-group textarea { min-height: 100px; resize: vertical; }
    .input-group input:focus, .input-group textarea:focus {
      border-color: var(--navy-700);
      box-shadow: 0 0 0 3px rgba(25, 69, 123, 0.15);
    }
    .input-group input[type="date"], .input-group input[type="time"] {
      min-height: 46px;
      color-scheme: light;
    }
    .btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, var(--navy-800), var(--navy-900));
      box-shadow: 0 6px 14px rgba(11, 31, 59, 0.24);
    }
    .btn:active { transform: translateY(1px); }
    .status {
      font-size: 13px;
      color: var(--muted);
      margin-top: 10px;
      min-height: 18px;
    }
    .status.status-success { color: var(--success-text); font-weight: 600; }
    .result-list {
      margin-top: 12px;
      list-style: none;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
    }
    .result-item {
      padding: 13px 12px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      cursor: pointer;
    }
    .result-item:last-child { border-bottom: none; }
    .result-item-arrow { color: var(--muted); font-size: 13px; }
    .result-item-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .detail-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      margin-top: 12px;
      display: none;
      flex-direction: column;
      overflow: hidden;
      background: #fff;
    }
    .detail-card.show { display: flex; }
    .detail-header {
      background: linear-gradient(135deg, var(--navy-800), var(--navy-900));
      color: #fff;
      font-weight: 700;
      padding: 11px 12px;
      font-size: 14px;
    }
    .detail-row {
      padding: 11px 12px;
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { min-width: 80px; color: var(--muted); font-size: 12px; }
    .detail-value { font-size: 14px; line-height: 1.5; word-break: break-word; white-space: pre-wrap; }
    .sent-badge {
      background: var(--success-bg);
      color: var(--success-text);
      padding: 10px;
      border-radius: 10px;
      margin-top: 10px;
      display: none;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
    }
    .hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 8px;
      line-height: 1.45;
    }
    @media (min-width: 768px) {
      .container { padding: 20px 18px 30px; }
      .panel { padding: 18px; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1>訪問介護記録</h1>
  <p class="header-sub">Home-visit care log · LINE WORKS</p>
</div>
<div class="container">
  <div class="tab-bar">
    <button type="button" class="tab active" id="tab-add" onclick="switchTab('add')">記録を登録</button>
    <button type="button" class="tab" id="tab-search" onclick="switchTab('search')">記録を検索</button>
  </div>

  <div class="section active" id="section-add">
    <div class="panel">
      <p class="panel-title">本日の訪問内容を入力</p>
      <div class="input-group">
        <label for="addClient">利用者名</label>
        <input type="text" id="addClient" placeholder="例：山田 太郎" autocomplete="name">
      </div>
      <div class="input-group">
        <label for="addVisitDate">訪問日</label>
        <input type="date" id="addVisitDate">
      </div>
      <div class="input-group">
        <label for="addVisitTime">訪問時間</label>
        <input type="text" id="addVisitTime" placeholder="例：10:00〜11:00">
      </div>
      <div class="input-group">
        <label for="addServices">サービス内容</label>
        <textarea id="addServices" placeholder="身体介護・生活援助・看護など、実施した内容"></textarea>
      </div>
      <div class="input-group">
        <label for="addNotes">特記事項</label>
        <textarea id="addNotes" placeholder="バイタル・家族連絡・次回注意点など（任意）"></textarea>
      </div>
      <button type="button" class="btn" onclick="doAddRecord()">スプレッドシートに保存</button>
      <p class="status" id="addStatus"></p>
      <p class="hint">GAS 側では <code style="font-size:11px;">action: &quot;kaigo_add&quot;</code> で受け取る想定です。フィールド名はスクリプトと合わせて調整してください。</p>
    </div>
  </div>

  <div class="section" id="section-search">
    <div class="panel">
      <p class="panel-title">過去の記録を検索</p>
      <div class="input-group">
        <label for="searchQuery">利用者名（部分一致）</label>
        <input type="text" id="searchQuery" placeholder="利用者名を入力">
      </div>
      <button type="button" class="btn" onclick="doSearchRecords()">検索する</button>
      <p class="status" id="searchStatus"></p>
      <ul class="result-list" id="resultList"></ul>
      <div class="detail-card" id="resultDetail">
        <div class="detail-header">記録の詳細</div>
        <div class="detail-row"><span class="detail-label">利用者名</span><span class="detail-value" id="d-client"></span></div>
        <div class="detail-row"><span class="detail-label">訪問日</span><span class="detail-value" id="d-date"></span></div>
        <div class="detail-row"><span class="detail-label">訪問時間</span><span class="detail-value" id="d-time"></span></div>
        <div class="detail-row"><span class="detail-label">サービス内容</span><span class="detail-value" id="d-services"></span></div>
        <div class="detail-row"><span class="detail-label">特記事項</span><span class="detail-value" id="d-notes"></span></div>
      </div>
      <div class="sent-badge" id="sentBadge">チャットに概要を送信しました</div>
      <p class="hint">GAS 側では <code style="font-size:11px;">action: &quot;kaigo_search&quot;</code> と <code style="font-size:11px;">query</code> で受け取る想定です。返却は <code style="font-size:11px;">{ records: [...] }</code> 形式を想定しています。</p>
    </div>
  </div>
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbxM9qrmqSHc4r9rfCZPyClgysoYcjNilcb6YoGeVtjlPuCs0ppfz9Wz5Ye/exec";
  const WOFF_ID = "j5bJbWn6Qg1ppttwac1wMA";
  let userId = "";

  function inWoffClient() {
    try {
      return typeof woff !== "undefined" && typeof woff.isInClient === "function" && woff.isInClient();
    } catch (e) {
      return false;
    }
  }

  function switchTab(tab) {
    document.getElementById("tab-add").classList.toggle("active", tab === "add");
    document.getElementById("tab-search").classList.toggle("active", tab === "search");
    document.getElementById("section-add").classList.toggle("active", tab === "add");
    document.getElementById("section-search").classList.toggle("active", tab === "search");
  }

  function todayDateInput() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  window.onload = () => {
    const dateEl = document.getElementById("addVisitDate");
    if (dateEl && !dateEl.value) dateEl.value = todayDateInput();
    if (!inWoffClient()) return;
    woff.init({ woffId: WOFF_ID })
      .then(() => woff.getProfile())
      .then(profile => { userId = profile.userId || ""; })
      .catch(console.error);
  };

  function field(record, keys) {
    for (let i = 0; i < keys.length; i++) {
      const k = keys[i];
      if (record[k] != null && String(record[k]).trim() !== "") return String(record[k]);
    }
    return "";
  }

  async function doAddRecord() {
    const client = document.getElementById("addClient").value.trim();
    const visitDate = document.getElementById("addVisitDate").value.trim();
    const visitTime = document.getElementById("addVisitTime").value.trim();
    const services = document.getElementById("addServices").value.trim();
    const notes = document.getElementById("addNotes").value.trim();
    const statusEl = document.getElementById("addStatus");
    statusEl.classList.remove("status-success");

    if (!client || !visitDate || !services) {
      statusEl.textContent = "利用者名・訪問日・サービス内容は必須です";
      return;
    }

    statusEl.textContent = "送信中…";
    const body = JSON.stringify({
      action: "kaigo_add",
      利用者名: client,
      訪問日: visitDate,
      訪問時間: visitTime,
      サービス内容: services,
      特記事項: notes,
      userId
    });

    try {
      const res = await fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.ok === false || data.error || data.success === false) {
        statusEl.textContent = data.error || data.message || "保存に失敗しました";
        return;
      }
      statusEl.classList.add("status-success");
      statusEl.textContent = "✅ 保存しました";
      if (inWoffClient()) {
        woff.sendMessage([{
          type: "text",
          text: "✅ 訪問介護記録を保存しました\n【" + client + "】 " + visitDate + " " + visitTime
        }]);
      }
    } catch (e) {
      statusEl.textContent = "通信エラーが発生しました";
    }
  }

  async function doSearchRecords() {
    const query = document.getElementById("searchQuery").value.trim();
    const searchStatusEl = document.getElementById("searchStatus");
    searchStatusEl.classList.remove("status-success");
    document.getElementById("resultList").innerHTML = "";
    document.getElementById("resultDetail").classList.remove("show");
    document.getElementById("sentBadge").style.display = "none";

    if (!query) {
      searchStatusEl.textContent = "利用者名を入力してください";
      return;
    }

    searchStatusEl.textContent = "検索中…";

    try {
      const res = await fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ action: "kaigo_search", query, userId })
      });
      const data = await res.json().catch(() => ({}));
      const results = Array.isArray(data) ? data : (data.records || []);

      if (data.error) {
        searchStatusEl.textContent = String(data.error);
        return;
      }
      if (!results.length) {
        searchStatusEl.textContent = "該当する記録が見つかりませんでした";
        return;
      }

      searchStatusEl.textContent = results.length + "件見つかりました";
      const list = document.getElementById("resultList");

      results.forEach(item => {
        const li = document.createElement("li");
        li.className = "result-item";
        const name = field(item, ["利用者名", "client", "name"]) || "（氏名なし）";
        const dateStr = field(item, ["訪問日", "visitDate", "日付"]);
        const meta = dateStr ? '<div class="result-item-meta">' + escapeHtml(dateStr) + "</div>" : "";
        li.innerHTML = "<div><span>" + escapeHtml(name) + "</span>" + meta + '</div><span class="result-item-arrow">詳細</span>';
        li.onclick = () => {
          const client = field(item, ["利用者名", "client", "name"]);
          const vd = field(item, ["訪問日", "visitDate", "日付"]);
          const vt = field(item, ["訪問時間", "visitTime", "時間"]);
          const sv = field(item, ["サービス内容", "services", "内容"]);
          const nt = field(item, ["特記事項", "notes", "備考"]);
          document.getElementById("d-client").textContent = client;
          document.getElementById("d-date").textContent = vd;
          document.getElementById("d-time").textContent = vt;
          document.getElementById("d-services").textContent = sv;
          document.getElementById("d-notes").textContent = nt;
          document.getElementById("resultDetail").classList.add("show");
          if (inWoffClient()) {
            const msg = "【訪問介護記録】\n利用者: " + client + "\n訪問日: " + vd + (vt ? "\n時間: " + vt : "") + "\n内容: " + sv + (nt ? "\n特記: " + nt : "");
            woff.sendMessage([{ type: "text", text: msg }]);
            document.getElementById("sentBadge").style.display = "block";
          }
        };
        list.appendChild(li);
      });
    } catch (e) {
      searchStatusEl.textContent = "通信エラーが発生しました";
    }
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
</script>
</body>
</html>
